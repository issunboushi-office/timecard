<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f5f7">
<title>タイムカード</title>
<style>
  html, body { height: 100%; margin: 0; background: #f4f5f7; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; color: #1f2933; }
  #frame { display: none; border: 0; width: 100%; height: 100%; }
  #note { max-width: 420px; margin: 0 auto; padding: 40px 20px; line-height: 1.8; }
  #note h1 { font-size: 18px; margin: 0 0 12px; }
</style>
</head>
<body>
<iframe id="frame" title="タイムカード"></iframe>
<div id="note">
  <h1>タイムカード</h1>
  <p id="text">読み込み中…</p>
</div>

<script>
  // ▼ ここに、Apps Script の「ウェブアプリのURL」（末尾が /exec のもの）を入れる
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzAuQXLWWKPN6WS2DY6tHDVxcsqeb90YGtCnwhmRY67_3PprKRu7Yg5px533XSHi4KW/exec';
  // ▲ 変えるのはこの1行だけ

  (function () {
    var text = document.getElementById('text');
    var frame = document.getElementById('frame');

    // 自分専用リンクの合言葉（?k=…）を読み取る。半角英数字以外は取りのぞく
    var key = (new URLSearchParams(location.search).get('k') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 64);

    if (APP_URL.indexOf('https://script.google.com/') !== 0) {
      text.textContent = '設定がまだ終わっていません（ウェブアプリのURLが入っていません）。';
      return;
    }
    if (key === '') {
      text.textContent = 'このリンクでは使えません。自分専用のリンクから開いてください。';
      return;
    }

    frame.src = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'k=' + encodeURIComponent(key);
    frame.style.display = 'block';
    document.getElementById('note').style.display = 'none';
  })();
</script>
</body>
</html>
